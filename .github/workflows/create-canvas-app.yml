name: Create App

on:
  workflow_dispatch:
  push:
    tags:
      - "create-canvas-v*"
permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: create-canvas-app/web/package-lock.json

      - name: Sync tagged app version
        if: startsWith(github.ref, 'refs/tags/create-canvas-v')
        shell: bash
        run: |
          set -o pipefail
          node create-canvas-app/scripts/sync-version-from-web.mjs 2>&1 | tee create-canvas-version-sync.log

      - name: Upload version sync diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-version-sync-log
          path: create-canvas-version-sync.log
          if-no-files-found: ignore

      - name: Install Web dependencies
        working-directory: create-canvas-app/web
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        working-directory: create-canvas-app/web
        run: npm run typecheck

      - name: Test
        working-directory: create-canvas-app/web
        run: npm test

      - name: Build Web and Desktop assets
        working-directory: create-canvas-app/web
        run: |
          npm run build
          npm run build:desktop

      - name: Upload Desktop Web assets
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-desktop-web
          path: create-canvas-app/web/dist-desktop
          if-no-files-found: error

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-web
          path: create-canvas-app/web/dist
          if-no-files-found: error

  package-windows:
    needs: web-build
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: create-canvas-app/desktop/package-lock.json

      - name: Sync tagged app version
        if: startsWith(github.ref, 'refs/tags/create-canvas-v')
        run: node create-canvas-app/scripts/sync-version-from-web.mjs

      - name: Restore Desktop Web assets
        uses: actions/download-artifact@v4
        with:
          name: create-canvas-desktop-web
          path: create-canvas-app/web/dist-desktop

      - name: Install Desktop dependencies
        working-directory: create-canvas-app/desktop
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify Desktop shell
        working-directory: create-canvas-app/desktop
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee desktop-check.log

      - name: Package Windows ${{ matrix.arch }}
        working-directory: create-canvas-app/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' && 'true' || 'false' }}
        run: |
          set -o pipefail
          npm run dist:win:${{ matrix.arch }} 2>&1 | tee desktop-package.log

      - name: Upload Windows ${{ matrix.arch }} package
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-windows-${{ matrix.arch }}
          path: |
            create-canvas-app/desktop/release/win-${{ matrix.arch }}/*.exe
            create-canvas-app/desktop/release/win-${{ matrix.arch }}/*.blockmap
            create-canvas-app/desktop/release/win-${{ matrix.arch }}/*.yml
          if-no-files-found: error

      - name: Upload Windows ${{ matrix.arch }} diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-windows-${{ matrix.arch }}-build-log
          path: create-canvas-app/desktop/*.log
          if-no-files-found: ignore

  package-macos:
    needs: web-build
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: create-canvas-app/desktop/package-lock.json

      - name: Sync tagged app version
        if: startsWith(github.ref, 'refs/tags/create-canvas-v')
        run: node create-canvas-app/scripts/sync-version-from-web.mjs

      - name: Restore Desktop Web assets
        uses: actions/download-artifact@v4
        with:
          name: create-canvas-desktop-web
          path: create-canvas-app/web/dist-desktop

      - name: Install Desktop dependencies
        working-directory: create-canvas-app/desktop
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify Desktop shell
        working-directory: create-canvas-app/desktop
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee desktop-check.log

      - name: Package macOS ${{ matrix.arch }}
        working-directory: create-canvas-app/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
        run: |
          set -o pipefail
          npm run dist:mac:${{ matrix.arch }} 2>&1 | tee desktop-package.log

      - name: Upload macOS ${{ matrix.arch }} package
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-macos-${{ matrix.arch }}
          path: |
            create-canvas-app/desktop/release/mac-${{ matrix.arch }}/*.dmg
            create-canvas-app/desktop/release/mac-${{ matrix.arch }}/*.zip
            create-canvas-app/desktop/release/mac-${{ matrix.arch }}/*.yml
          if-no-files-found: error

      - name: Upload macOS ${{ matrix.arch }} diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-macos-${{ matrix.arch }}-build-log
          path: create-canvas-app/desktop/*.log
          if-no-files-found: ignore
