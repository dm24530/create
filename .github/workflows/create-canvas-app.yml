name: Create App

on:
  workflow_dispatch:
  push:
    tags:
      - "create-canvas-v*"

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Sync tagged app version
        if: startsWith(github.ref, 'refs/tags/create-canvas-v')
        shell: bash
        run: |
          set -o pipefail
          set +e
          node scripts/sync-version-from-web.mjs 2>&1 | tee create-canvas-version-sync.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tr '\n' ' ' < create-canvas-version-sync.log | cut -c1-3500)
            echo "::error title=Version sync failed::$message"
            exit "$status"
          fi

      - name: Upload version sync diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-version-sync-log
          path: create-canvas-version-sync.log
          if-no-files-found: ignore

      - name: Verify version consistency
        run: npm run version:check

      - name: Install Web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm test

      - name: Build Web and Desktop assets
        working-directory: web
        run: |
          npm run build
          npm run build:desktop

      - name: Upload Desktop Web assets
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-desktop-web
          path: web/dist-desktop
          if-no-files-found: error

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-web
          path: web/dist
          if-no-files-found: error

  package-windows:
    needs: web-build
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Sync tagged app version
        if: startsWith(github.ref, 'refs/tags/create-canvas-v')
        run: node scripts/sync-version-from-web.mjs

      - name: Verify version consistency
        run: npm run version:check

      - name: Restore Desktop Web assets
        uses: actions/download-artifact@v4
        with:
          name: create-canvas-desktop-web
          path: web/dist-desktop

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify Desktop startup
        if: matrix.arch == 'x64'
        working-directory: desktop
        run: npm run test:smoke

      - name: Verify Desktop shell
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm run check 2>&1 | tee desktop-check.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tr '\n' ' ' < desktop-check.log | cut -c1-3500)
            echo "::error title=Desktop shell check failed::$message"
            {
              echo '### Desktop shell check failed'
              echo '```text'
              tail -n 120 desktop-check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Package Windows ${{ matrix.arch }}
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' && 'true' || 'false' }}
        run: |
          set -o pipefail
          [ -n "${CSC_LINK:-}" ] || unset CSC_LINK
          [ -n "${CSC_KEY_PASSWORD:-}" ] || unset CSC_KEY_PASSWORD
          set +e
          npm run dist:win:${{ matrix.arch }} 2>&1 | tee desktop-package.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tr '\n' ' ' < desktop-package.log | cut -c1-3500)
            echo "::error title=Desktop package failed (${{ matrix.arch }})::$message"
            {
              echo '### Desktop package failed (${{ matrix.arch }})'
              echo '```text'
              tail -n 160 desktop-package.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Verify Windows signature and checksums
        shell: pwsh
        env:
          HAS_WIN_CERT: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          $releaseDir = "desktop/release/win-${{ matrix.arch }}"
          $installers = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "uninstaller|elevate" }
          if ($installers.Count -lt 1) { throw "Windows installer was not produced" }

          if ($env:HAS_WIN_CERT -eq "true") {
            foreach ($installer in $installers) {
              $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
              if ($signature.Status -ne "Valid") {
                throw "Windows installer signature is invalid: $($installer.Name) / $($signature.Status)"
              }
            }
          } else {
            Write-Warning "WIN_CSC_LINK is not configured; Windows artifacts are unsigned."
          }

          $checksumLines = foreach ($file in Get-ChildItem -Path $releaseDir -File | Where-Object { $_.Extension -in ".exe", ".blockmap" -or $_.Name -like "latest*.yml" }) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            "$hash  $($file.Name)"
          }
          $checksumLines | Set-Content -LiteralPath (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

      - name: Upload Windows ${{ matrix.arch }} package
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-windows-${{ matrix.arch }}
          path: |
            desktop/release/win-${{ matrix.arch }}/*.exe
            desktop/release/win-${{ matrix.arch }}/*.blockmap
            desktop/release/win-${{ matrix.arch }}/latest*.yml
            desktop/release/win-${{ matrix.arch }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload Windows ${{ matrix.arch }} diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-windows-${{ matrix.arch }}-build-log
          path: desktop/*.log
          if-no-files-found: ignore

  package-macos:
    needs: web-build
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
    runs-on: macos-latest
    env:
      HAS_MAC_CERT: ${{ secrets.CSC_LINK != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Sync tagged app version
        if: startsWith(github.ref, 'refs/tags/create-canvas-v')
        run: node scripts/sync-version-from-web.mjs

      - name: Verify version consistency
        run: npm run version:check

      - name: Check macOS signing credentials
        if: startsWith(github.ref, 'refs/tags/create-canvas-v')
        shell: bash
        env:
          CSC_LINK_VALUE: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_VALUE: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64_VALUE: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          signing_ready=1
          if [ -z "${CSC_LINK_VALUE:-}" ] || [ -z "${CSC_KEY_PASSWORD_VALUE:-}" ]; then
            signing_ready=0
          fi

          apple_id_ready=1
          if [ -z "${APPLE_ID_VALUE:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD_VALUE:-}" ] || [ -z "${APPLE_TEAM_ID_VALUE:-}" ]; then
            apple_id_ready=0
          fi

          api_key_ready=1
          if [ -z "${APPLE_API_KEY_BASE64_VALUE:-}" ] || [ -z "${APPLE_API_KEY_ID_VALUE:-}" ] || [ -z "${APPLE_API_ISSUER_VALUE:-}" ]; then
            api_key_ready=0
          fi

          if [ "$signing_ready" -ne 1 ]; then
            echo "::warning title=Unsigned macOS build::Developer ID credentials are not configured; this release will use ad-hoc signing and users must approve it in macOS Security settings."
          elif [ "$apple_id_ready" -ne 1 ] && [ "$api_key_ready" -ne 1 ]; then
            echo "::warning title=Unnotarized macOS build::Developer ID signing is configured but notarization credentials are missing; Gatekeeper may still block the app."
          else
            echo "macOS Developer ID signing and notarization credentials are configured."
          fi

      - name: Prepare App Store Connect API key
        if: env.HAS_APPLE_API_KEY == 'true'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Restore Desktop Web assets
        uses: actions/download-artifact@v4
        with:
          name: create-canvas-desktop-web
          path: web/dist-desktop

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify Desktop shell
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm run check 2>&1 | tee desktop-check.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tr '\n' ' ' < desktop-check.log | cut -c1-3500)
            echo "::error title=Desktop shell check failed::$message"
            {
              echo '### Desktop shell check failed'
              echo '```text'
              tail -n 120 desktop-check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Verify Desktop startup
        if: matrix.arch == 'arm64'
        working-directory: desktop
        run: npm run test:smoke

      - name: Package macOS ${{ matrix.arch }}
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
        run: |
          set -o pipefail
          [ -n "${CSC_LINK:-}" ] || unset CSC_LINK
          [ -n "${CSC_KEY_PASSWORD:-}" ] || unset CSC_KEY_PASSWORD
          [ -n "${APPLE_ID:-}" ] || unset APPLE_ID
          [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || unset APPLE_APP_SPECIFIC_PASSWORD
          [ -n "${APPLE_TEAM_ID:-}" ] || unset APPLE_TEAM_ID
          if [ -n "${CSC_LINK:-}" ]; then
            package_script="dist:mac:${{ matrix.arch }}"
          else
            package_script="dist:mac:${{ matrix.arch }}:unsigned"
          fi
          set +e
          npm run "$package_script" 2>&1 | tee desktop-package.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tr '\n' ' ' < desktop-package.log | cut -c1-3500)
            echo "::error title=Desktop package failed (${{ matrix.arch }})::$message"
            {
              echo '### Desktop package failed (${{ matrix.arch }})'
              echo '```text'
              tail -n 160 desktop-package.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Verify macOS signature and notarization
        if: env.HAS_MAC_CERT == 'true' && startsWith(github.ref, 'refs/tags/create-canvas-v')
        shell: bash
        env:
          HAS_MAC_CERT: ${{ secrets.CSC_LINK != '' }}
        run: |
          app_path=$(find "release/mac-${{ matrix.arch }}" -type d -name "*.app" | head -n 1)
          if [ -z "$app_path" ]; then
            echo "::error title=macOS app missing::No .app bundle was produced"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Verify unsigned macOS ad-hoc signature
        if: env.HAS_MAC_CERT != 'true'
        working-directory: desktop
        shell: bash
        env:
          HAS_MAC_CERT: ${{ secrets.CSC_LINK != '' }}
        run: |
          app_path=$(find "release/mac-${{ matrix.arch }}" -type d -name "*.app" | head -n 1)
          if [ -z "$app_path" ]; then
            echo "::error title=macOS app missing::No .app bundle was produced"
            exit 1
          fi
          test -f "$app_path/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | tee mac-signature.log
          grep -q "Signature=adhoc" mac-signature.log

      - name: Report unsigned macOS build
        if: env.HAS_MAC_CERT != 'true'
        shell: bash
        env:
          HAS_MAC_CERT: ${{ secrets.CSC_LINK != '' }}
        run: |
          echo "::warning title=Unsigned macOS installer::This DMG is ad-hoc signed but not notarized. Users may need System Settings > Privacy & Security > Open Anyway."

      - name: Generate macOS checksums
        working-directory: desktop
        shell: bash
        run: |
          shasum -a 256 release/mac-${{ matrix.arch }}/*.dmg release/mac-${{ matrix.arch }}/*.zip \
            > release/mac-${{ matrix.arch }}/SHA256SUMS.txt

      - name: Upload macOS ${{ matrix.arch }} package
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-macos-${{ matrix.arch }}
          path: |
            desktop/release/mac-${{ matrix.arch }}/*.dmg
            desktop/release/mac-${{ matrix.arch }}/*.zip
            desktop/release/mac-${{ matrix.arch }}/latest*.yml
            desktop/release/mac-${{ matrix.arch }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload macOS ${{ matrix.arch }} diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: create-canvas-macos-${{ matrix.arch }}-build-log
          path: desktop/*.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/create-canvas-v')
    needs:
      - package-windows
      - package-macos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows x64 package
        uses: actions/download-artifact@v4
        with:
          name: create-canvas-windows-x64
          path: artifacts/windows-x64

      - name: Download Windows ARM64 package
        uses: actions/download-artifact@v4
        with:
          name: create-canvas-windows-arm64
          path: artifacts/windows-arm64

      - name: Download macOS arm64 package
        uses: actions/download-artifact@v4
        with:
          name: create-canvas-macos-arm64
          path: artifacts/macos-arm64

      - name: Download macOS x64 package
        uses: actions/download-artifact@v4
        with:
          name: create-canvas-macos-x64
          path: artifacts/macos-x64

      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.blockmap" \) \
            ! -name "*uninstaller*" -exec cp -v {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Prepare R2 update manifests
        shell: bash
        env:
          UPDATE_SITE_DIR: update-site
          WINDOWS_X64_DIR: artifacts/windows-x64
          WINDOWS_ARM64_DIR: artifacts/windows-arm64
          MACOS_ARM64_DIR: artifacts/macos-arm64
          MACOS_X64_DIR: artifacts/macos-x64
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#create-canvas-v}"
          export RELEASE_BASE_URL="https://download.superai.sbs/app-releases/v${version}"
          node scripts/prepare-update-site.mjs

      - name: Validate R2 configuration
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for name in R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error title=R2 configuration missing::$name is not configured in repository secrets"
              exit 1
            fi
          done

      - name: Upload release assets to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_S3_ADDRESSING_STYLE: path
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#create-canvas-v}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          release_prefix="app-releases/v${version}"
          aws s3 cp release-assets/ "s3://${R2_BUCKET}/${release_prefix}/" --recursive --endpoint-url "${endpoint}" --only-show-errors --cache-control "public,max-age=31536000,immutable"

      - name: Upload update manifests to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_S3_ADDRESSING_STYLE: path
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mappings=(
            "update-site/windows/x64/latest.yml:app-releases/windows/x64/latest.yml"
            "update-site/windows/arm64/latest.yml:app-releases/windows/arm64/latest.yml"
            "update-site/macos/arm64/latest-mac.yml:app-releases/macos/arm64/latest-mac.yml"
            "update-site/macos/x64/latest-mac.yml:app-releases/macos/x64/latest-mac.yml"
          )
          for mapping in "${mappings[@]}"; do
            source="${mapping%%:*}"
            key="${mapping#*:}"
            echo "Uploading ${source} -> s3://${R2_BUCKET}/${key}"
            aws s3 cp "${source}" "s3://${R2_BUCKET}/${key}" --endpoint-url "${endpoint}" --only-show-errors --cache-control "no-cache,max-age=0"
            aws s3api head-object --bucket "${R2_BUCKET}" --key "${key}" --endpoint-url "${endpoint}" >/dev/null
          done

      - name: Verify public R2 release
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#create-canvas-v}"
          release_base_url="https://download.superai.sbs/app-releases/v${version}"
          manifests=(
            "https://download.superai.sbs/app-releases/windows/x64/latest.yml"
            "https://download.superai.sbs/app-releases/windows/arm64/latest.yml"
            "https://download.superai.sbs/app-releases/macos/arm64/latest-mac.yml"
            "https://download.superai.sbs/app-releases/macos/x64/latest-mac.yml"
          )
          for url in "${manifests[@]}"; do
            manifest_file="$(mktemp)"
            downloaded=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --max-time 20 "$url" -o "$manifest_file"; then
                downloaded=true
                break
              fi
              echo "Manifest not public yet (attempt ${attempt}/12): ${url}"
              sleep 5
            done
            test "$downloaded" = true
            grep -q "version: ${version}" "$manifest_file"
            grep -q "${release_base_url}/" "$manifest_file"
            echo "Verified manifest: ${url}"
          done
          installers=(
            "${release_base_url}/Create-Setup-${version}-win-x64.exe"
            "${release_base_url}/Create-Setup-${version}-win-arm64.exe"
            "${release_base_url}/Create-${version}-mac-arm64.dmg"
            "${release_base_url}/Create-${version}-mac-x64.dmg"
          )
          for url in "${installers[@]}"; do
            curl --fail --silent --show-error --location --head --retry 6 --retry-delay 3 --retry-all-errors --max-time 30 "$url" >/dev/null
            echo "Verified installer: ${url}"
          done
          {
            echo "## Create ${version} published to R2"
            echo ""
            echo "Download base: ${release_base_url}/"
            echo "Update manifest base: https://download.superai.sbs/app-releases/"
            echo "All four update manifests and installers were verified publicly."
          } >> "$GITHUB_STEP_SUMMARY"
